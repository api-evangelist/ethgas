aid: ethgas
name: ETHGas
description: >-
  ETHGas is an Ethereum blockspace exchange that turns Ethereum blockspace into a
  tradable commodity, enabling instant transactions through preconfirmations
  (execution and inclusion preconfs), whole-block commitments, and base-fee
  futures. Its public developer platform exposes a v1 REST API and a WebSocket
  streaming API for market data, order placement and management, funding
  (collateral deposits and withdrawals), and validator/builder registration.
  Authentication uses an EIP-712 wallet-signature login that issues a short-lived
  JWT bearer token; public market-data endpoints under /api/v1/p require none.
  ETHGas runs on Ethereum mainnet with a Hoodi testnet environment, and backs the
  exchange with a Commit-Boost validator module and a modified rbuilder block
  builder. ETHGas is backed by Polychain.
